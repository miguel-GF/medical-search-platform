<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Pruevia: compara estudios médicos y sucursales con información trazable.">
  <meta name="theme-color" content="#0F766E">
  <meta name="application-name" content="Pruevia">
  <meta name="pruevia-build" content="__PRUEVIA_BUILD__">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pruevia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pruevia · Estudios claros, decisiones informadas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="install.css">
  <link rel="stylesheet" href="pwa-updates.css">
</head>
<body>
  <aside id="app-update" class="app-update" role="status" aria-live="polite" hidden>
    <strong>Hay una nueva versión de la app Pruevia</strong>
    <p id="app-update-message">Puedes seguir usando la app o actualizar ahora.</p>
    <small>Actualizar reinicia la app. Termina primero tu orden o consulta; lo que tengas abierto se borrará.</small>
    <div class="app-update-actions">
      <button id="app-update-action" type="button">Actualizar y reiniciar</button>
      <button id="app-update-later" type="button">Más tarde</button>
    </div>
  </aside>
  <aside id="install-help" class="install-help" aria-label="Instalar Pruevia" hidden>
    <span id="install-message"></span>
    <button id="install-action" type="button" hidden>Instalar Pruevia</button>
    <button id="install-dismiss" type="button" aria-label="Cerrar instrucciones de instalación">×</button>
  </aside>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script src="install.js" defer></script>
  <script src="pwa-updates.js" defer></script>
</body>
</html>
