name = "pruevia-api-dev"
main = "src/index.ts"
compatibility_date = "2026-08-25"

# The handler is fail-closed unless NORMALIZATION_REPROCESS_ENABLED=true is
# configured separately. The trigger never performs fuzzy/AI approvals.
[triggers]
crons = ["17 * * * *"]

[vars]
API_VERSION = "v1"
APP_ENV = "production"
PROVIDER_DOCUMENTS_ENABLED = "false"
SUPABASE_TIMEOUT_MS = "5000"
# Until an HTTPS DEV frontend exists, keep browser CORS restricted to the
# Worker's own reviewed origin. Native Android and server smoke requests do not
# send Origin; add real frontend origins explicitly when they are deployed.
ALLOWED_ORIGINS = "https://pruevia-api-dev.miguel-gf-130.workers.dev"

# Abuse controls. The namespace IDs must be unique within the Cloudflare
# account; reserve/change them in production if the account already uses them.
[[ratelimits]]
name = "PUBLIC_RATE_LIMITER"
namespace_id = "910001"

  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "REVIEW_CAPTURE_RATE_LIMITER"
namespace_id = "910004"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "OCR_RATE_LIMITER"
namespace_id = "910002"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "910003"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "PROVIDER_RATE_LIMITER"
namespace_id = "910005"

  [ratelimits.simple]
  limit = 60
  period = 60

[ai]
binding = "AI"

# Secrets are set with `wrangler secret put` and never committed:
# SUPABASE_URL
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SECRET_KEY
# (los nombres ANON_KEY/SERVICE_ROLE_KEY se aceptan sólo durante la migración)
# ADMIN_USER_IDS (comma-separated Supabase auth user UUIDs allowed into Admin)
# ALLOWED_ORIGIN (legacy single origin; use ALLOWED_ORIGINS for multiple frontends)
# ALLOWED_ORIGINS (optional comma-separated exact origins; do not use '*')
