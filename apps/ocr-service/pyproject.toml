[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruevia-ocr-service"
version = "0.1.0"
description = "Private, non-persistent OCR service for Pruevia medical orders"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  # Pillow versions before 12.3.0 carry multiple image parsing/security
  # fixes. Keep the upper bound so a future major release is reviewed first.
  "pillow>=12.3.0,<13",
  # The image build pre-bundles the models from this exact release. Updating
  # RapidOCR requires reviewing its model manifest and hashes again.
  "rapidocr==3.9.2",
  "onnxruntime>=1.18,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
]

[project.scripts]
pruevia-ocr = "pruevia_ocr_service.cli:main"
pruevia-ocr-scan = "pruevia_ocr_service.scan:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
