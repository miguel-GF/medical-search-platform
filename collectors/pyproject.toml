[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pruevia-collectors"
version = "0.1.0"
description = "Reproducible RAW ingestion and collector framework for Pruevia"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "certifi>=2024.2.2",
  "truststore>=0.10.0",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
pruevia-denue = "pruevia_collectors.cli:main"
pruevia-chopo = "pruevia_collectors.cli_chopo:main"
pruevia-ruiz = "pruevia_collectors.cli_ruiz:main"
pruevia-salud-digna = "pruevia_collectors.cli_salud_digna:main"
pruevia-generic = "pruevia_collectors.cli_generic:main"
pruevia-puebla-discovery = "pruevia_collectors.puebla_discovery:main"
pruevia-puebla-retry = "pruevia_collectors.puebla_retry:main"
pruevia-publish = "pruevia_collectors.cli_publish:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
