name: Pruevia CI

on:
  push:
    branches: [main, develop]
  pull_request:

# CI only needs to read the repository. Keep the implicit GITHUB_TOKEN
# permissions closed in case a third-party action is compromised.
permissions:
  contents: read

jobs:
  collectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools pip-audit
      - run: python -m pip install -e '.[dev]'
      - run: python -m pip_audit --skip-editable --progress-spinner off
      - run: python -m pytest -q

  ocr-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ocr-service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools pip-audit
      - run: python -m pip install --constraint constraints.txt -e '.[dev]'
      - run: python -m pip_audit --skip-editable --progress-spinner off
      - run: python -m pytest -q

  document-scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/document-scanner
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/document-scanner/pyproject.toml
      - run: python -m pip install --upgrade pip setuptools pip-audit
      - run: python -m pip install --constraint constraints.txt -e '.[dev]'
      - run: python -m pip_audit --skip-editable --progress-spinner off
      - run: python -m pytest -q

  database-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip setuptools pip-audit pytest
      - run: python -m pip_audit --progress-spinner off
      - run: python -m pytest -q database/tests

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm exec --offline -- wrangler deploy --dry-run --temporary

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Exercise the production configuration gate with non-secret
          # placeholders; deployment supplies the real reviewed origins.
          VITE_API_URL: https://api.example
          VITE_API_ALLOWED_HOSTS: api.example
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_ALLOWED_HOSTS: project.supabase.co
      - run: npm run render:headers
        env:
          # Render the deployed static CSP from the same reviewed origins.
          VITE_API_URL: https://api.example
          VITE_API_ALLOWED_HOSTS: api.example
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_ALLOWED_HOSTS: project.supabase.co
      - name: Verify Admin cache policy is fail-closed
        shell: bash
        run: |
          grep -Fq 'Cache-Control: no-cache, no-store, must-revalidate' dist/_headers

  patient-flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/patient
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define=API_BASE_URL=https://api.example --dart-define=API_ALLOWED_HOSTS=api.example
      - run: dart run tool/render_web_headers.dart --output build/web/_headers --allowed-hosts api.example

  database-contracts:
    # Never expose the Supabase access token to code from a pull request. A
    # same-repository PR can modify this checkout, so run the remote contract
    # gate only after code has landed on a protected branch.
    if: github.event_name == 'push' && github.ref_protected == true && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    steps:
      - id: secrets
        shell: bash
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -n "$SUPABASE_ACCESS_TOKEN" && -n "$SUPABASE_PROJECT_REF" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require database gate secrets on protected branches
        if: steps.secrets.outputs.configured != 'true'
        shell: bash
        working-directory: .
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required for the protected-branch database security gate"
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
        if: steps.secrets.outputs.configured == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.secrets.outputs.configured == 'true'
        with:
          python-version: '3.11'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 2.116.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Verify migration ledger is ordered
        if: steps.secrets.outputs.configured == 'true'
        run: python scripts/check_migration_order.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push --dry-run
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify least-privilege runtime schema
        if: steps.secrets.outputs.configured == 'true'
        run: python scripts/check_runtime_schema.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Run all SQL contracts
        shell: bash
        if: steps.secrets.outputs.configured == 'true'
        run: python scripts/run_sql_contracts.py
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
