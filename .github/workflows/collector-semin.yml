name: Pruevia SEMIN collector (prepared, disabled)

on:
  schedule:
    # 08:17 America/Mexico_City (UTC-6); only runs when the opt-in variable is true.
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semin-catalog:
    if: vars.PRUEVIA_COLLECTOR_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pruevia-collector-semin-catalog
      cancel-in-progress: false
    defaults:
      run:
        working-directory: collectors
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify source policy and capture bounded evidence
        env:
          PRUEVIA_DATABASE_URL: ${{ secrets.PRUEVIA_COLLECTOR_DATABASE_URL }}
        run: python -m pruevia_collectors.scheduled_runner semin_catalog_puebla --artifact-root "$RUNNER_TEMP/pruevia-collector"
